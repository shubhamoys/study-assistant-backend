services:
  postgres:
    image: postgres:16-alpine
    container_name: study-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: study_assistant
      POSTGRES_PASSWORD: study_assistant
      POSTGRES_DB: study_assistant_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U study_assistant -d study_assistant_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
